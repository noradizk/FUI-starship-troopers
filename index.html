<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Creative Coding</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <div id="wrap">
    <div id="stage">
      
      <div class="title">
        <h1 class="title-select">SELECTED</h1>
        <h1 class="title-lasers">LASERS</h1>
      </div>

      <div class="screen">

        <div class="TOTAL-LEFT">

          <div class="split-screen-1">

            <!-- LEFT COLUMN -->
            <div class="selected-col">

              <div class="design" id="load-image">
                <img src="" class="image-tattoo" alt="">
                <span class="design-placeholder">NO TATTOO</span>
              </div>

              <div id="text-purple">
                <canvas id="purple-rain"></canvas>
                <div id="digits"></div>

              </div>

              <!-- IMPORTANT: on garde ton bloc, mais on le met ici pour ne pas casser la row -->
              <div class="text-white">
                <p class="text-content">
                  AUTOMATIC<br>
                  SEQUENCE<br>
                  CONTROL<br>
                </p>
                
              </div>

            </div>

            <!-- RIGHT COLUMN -->
            <div class="lasers-col">
              <div class="lasers-stack">
                <div class="laser-box">
                  <h2 class="laser-name">Laser 1</h2>
                  <div class="laser-wrapper">
                    <canvas id="laser1"></canvas>
                  </div>
                </div>

                <div class="laser-box">
                  <h2 class="laser-name">Laser 2</h2>
                  <div class="laser-wrapper">
                    <canvas id="laser2"></canvas>
                  </div>
                </div>

                <div class="laser-box">
                  <h2 class="laser-name">Laser 3</h2>
                  <div class="laser-wrapper">
                    <canvas id="laser3"></canvas>
                  </div>
                </div>

                <div class="laser-box">
                  <h2 class="laser-name">Laser 4</h2>
                  <div class="laser-wrapper">
                    <canvas id="laser4"></canvas>
                  </div>
                </div>
              </div>
              <p class="laser-name">STATUS: READY</p>
            </div>
          </div>
        </div>

        <!-- RIGHT SIDE SCREEN -->
        <div class="split-screen-2">
          <div id="grid-wrapper">
            <canvas id="grid"></canvas>
            <canvas id="grid-img"></canvas>
          </div>
        </div>

      </div>

      <div class="footer">
          <div class="end-piece">
            <h1 class="titre-orange">SUBCUTANEOUS</h1>
          </div>
          <div class="rect-bottom">
            <div class="progress-inner"></div>
              <canvas class="progress"></canvas>
          </div>
      </div>

      <!-- POPUP -->
      <div id="select-popup" class="popup">
        <div class="popup-window">
          <div class="selection-wrapper">

            <div class="selection" data-tattoo="death_above">
              <img src="/images/death-above.png" alt="" class="selection-img" />
              
            </div>
            <div class="selection" data-tattoo="infantry">
              <img src="/images/infantry.png" alt="" class="selection-img" />
              
            </div>
            <div class="selection" data-tattoo="UCF">
              <img src="/images/UCF.png" alt="" class="selection-img" />
             
            </div>
            <div class="selection" data-tattoo="arachnids">
              <img src="/images/arachnids.png" alt="" class="selection-img" />
              
            </div>
            <div class="selection" data-tattoo="FedNet">
              <img src="/images/FedNet.png" alt="" class="selection-img" />
              
            </div>
            <div class="selection" data-tattoo="NoBugs">
              <img src="/images/NoBugs.png" alt="" class="selection-img" />
              
            </div>
            <div class="selection" data-tattoo="Fleet">
              <img src="/images/fleet.png" alt="" class="selection-img" />
              
            </div>
            <div class="selection" data-tattoo="rough">
              <img src="/images/rough.png" alt="" class="selection-img" />
              
            </div>
            <div class="selection" data-tattoo="more">
              <img src="/images/more.png" alt="" class="selection-img" />
              
            </div>
            <div class="selection" data-tattoo="movie_logo">
              <img src="/images/movie-logo.png" alt="" class="selection-img" />

            </div>
            <div class="selection" data-tattoo="sword">
              <img src="images/sword.png" alt="" class="selection-img" />
            </div>
            <div class="selection" data-tattoo="slot-12">
              <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="" class="selection-img" />

            </div>

          </div>
        </div>
      </div>

      <script type="module" src=".src/scale.js"></script>
      <script type="module" src="./src/pixel.js"></script>
      <script type="module" src="./src/main.js"></script>
      <script type="module" src="./src/grid.js"></script>
      <script type="module" src="./src/sineWave1.js"></script>
      <script type="module" src="./src/purple.js"></script>
    </div>
  </div>

</body>
</html>
